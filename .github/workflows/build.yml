name: Build Android (a2600-app)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Install cargo-apk2 via cargo-binstall
        run: |
          if ! command -v cargo-apk2 &> /dev/null; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | sh
            cargo binstall --no-confirm cargo-apk2
          else
            echo "cargo-apk2 already installed"
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true
          local-cache: true

      - name: Checkout ZAVOGLES-GUI
        uses: actions/checkout@v4
        with:
          repository: versonr7/ZAVOGLES-GUI
          path: ZAVOGLES-GUI

      - name: Link ZAVOGLES-GUI as sibling (matches local layout)
        run: ln -s "$GITHUB_WORKSPACE/ZAVOGLES-GUI" "$GITHUB_WORKSPACE/../ZAVOGLES-GUI"

      - name: Build Debug APK
        run: cargo apk2 build -p a2600-app
        env:
          RUSTFLAGS: "-C codegen-units=256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a2600-debug-apk
          path: target/debug/apk/*.apk
          