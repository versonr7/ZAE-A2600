[package]
name = "a2600-app"
version = "0.1.0"
edition = "2021"
authors = ["versonr7"]
description = "Atari 2600 emulator Android app"
license = "GPL-3.0-only"

[lib]
name = "a2600_app"
crate-type = ["cdylib"]

[dependencies]
za-math = { git = "https://github.com/versonr7/ZAVOGLES-GUI", package = "za-math", branch = "main" }
za-sys = { git = "https://github.com/versonr7/ZAVOGLES-GUI", package = "za-sys", branch = "main" }
za-gles = { git = "https://github.com/versonr7/ZAVOGLES-GUI", package = "za-gles", branch = "main" }
za-xmb = { git = "https://github.com/versonr7/ZAVOGLES-GUI", package = "za-xmb", branch = "main" }
zae-a2600 = { path = "../zae-a2600" }
heapless = "0.9.3"
libm = "0.2.16"

[package.metadata.android]
package = "com.versonr7.a2600app"
build_targets = ["aarch64-linux-android"]
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "ZAE-A2600"
debuggable = true

[[package.metadata.android.application.activity]]
name = "com.versonr7.a2600app.A2600Activity"
label = "ZAE-A2600"
exported = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
